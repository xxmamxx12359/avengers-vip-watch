   name: VIP seat watch

   on:
     schedule:
       - cron: "*/5 * * * *"
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     watch:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - run: pip install requests beautifulsoup4
         - run: python watch.py
           env:
             NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
         - name: Save state
           run: |
             git config user.name "watcher"
             git config user.email "watcher@users.noreply.github.com"
             git add state.json || true
             git diff --cached --quiet || (git commit -m "update state" && git push)
